name: Update README

on:
  schedule:
    # Runs every 24 hours
    - cron: '0 */24 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          USER="StefanMaron"
          API="https://api.github.com"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"

          commits=$(curl -s -H "$AUTH" -H "$ACCEPT" "$API/search/commits?q=author:$USER&per_page=1" | jq -r '.total_count // 0')
          prs_opened=$(curl -s -H "$AUTH" -H "$ACCEPT" "$API/search/issues?q=author:$USER+type:pr&per_page=1" | jq -r '.total_count // 0')
          prs_merged=$(curl -s -H "$AUTH" -H "$ACCEPT" "$API/search/issues?q=author:$USER+type:pr+is:merged&per_page=1" | jq -r '.total_count // 0')
          issues_opened=$(curl -s -H "$AUTH" -H "$ACCEPT" "$API/search/issues?q=author:$USER+type:issue&per_page=1" | jq -r '.total_count // 0')

          stars=0
          page=1
          while :; do
            resp=$(curl -s -H "$AUTH" "$API/users/$USER/repos?per_page=100&page=$page&type=owner")
            count=$(echo "$resp" | jq 'length')
            if [ "$count" -eq 0 ]; then break; fi
            page_stars=$(echo "$resp" | jq '[.[].stargazers_count] | add')
            stars=$((stars + page_stars))
            page=$((page + 1))
          done

          TABLE=$(printf '| Commits (public) | PRs opened | PRs merged | Issues opened | Stars earned |\n|---|---|---|---|---|\n| %s | %s | %s | %s | %s |' "$commits" "$prs_opened" "$prs_merged" "$issues_opened" "$stars")

          awk -v tbl="$TABLE" '
            /<!-- stats:START -->/ { print; print tbl; skip=1; next }
            /<!-- stats:END -->/ { skip=0 }
            skip { next }
            { print }
          ' README.md > README.md.tmp && mv README.md.tmp README.md

          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update GitHub stats"
            git push
          fi

      - name: Update GitHub Activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: 'Update GitHub activity'
          MAX_LINES: 8

      - name: Update Blog Posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "blog"
          feed_list: "https://stefanmaron.com/index.xml"
          max_post_count: 4
          commit_message: "Update blog posts"
          template: "$newline- [$title]($url)$newline"

      - name: Update YouTube Videos
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "youtube"
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCsP1S8tZ1qZX8PJTubGIDVQ"
          max_post_count: 2
          commit_message: "Update YouTube videos"
          template: "$newline- [$title]($url)$newline"
